<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CaseWhen Social Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f3f6f4;--surface:#fff;--surface-2:#eef3f0;--fg:#15201c;--muted:#5b6b65;--line:#dde6e1;
  --accent:#1d967c;--accent-deep:#11493f;--accent-pale:#d8f3ee;--accent-mid:#7ac4b5;
  --prop:#b8791a;--prop-bg:#fbf1dd;--de:#17836c;--shadow:0 10px 30px rgba(14,47,40,.10);
  --ig:#d1397a;--tiktok:#1b1b1f;--youtube:#d93025;--facebook:#1877f2;--threads:#1b1b1f;--linkedin:#0a66c2;--google:#1a73e8;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e2f28;--surface:#123a32;--surface-2:#0e342c;--fg:#e8f3ef;--muted:#9bb3ab;--line:#1e4a40;
  --accent:#7ac4b5;--accent-deep:#0b2520;--accent-pale:#16463c;--accent-mid:#2f8d78;
  --prop:#e0b050;--prop-bg:#2a2410;--de:#7ac4b5;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#0e2f28;--surface:#123a32;--surface-2:#0e342c;--fg:#e8f3ef;--muted:#9bb3ab;--line:#1e4a40;--accent:#7ac4b5;--accent-deep:#0b2520;--accent-pale:#16463c;--accent-mid:#2f8d78;--prop:#e0b050;--prop-bg:#2a2410;--de:#7ac4b5;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---- login gate ---- */
/* scroll-lock the login: no document scroll while the gate is up (released on sign-in) */
html.locked,html.locked body{height:100%;overflow:hidden;overscroll-behavior:none}
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px 0;position:relative;overflow:hidden;isolation:isolate}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(14,47,40,.22);
  max-width:380px;width:100%;padding:28px 26px;position:relative;z-index:1;backdrop-filter:saturate(1.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:0 24px 70px rgba(0,0,0,.5)}}
:root[data-theme="dark"] .card{box-shadow:0 24px 70px rgba(0,0,0,.5)}
/* ---- on-brand animated backdrop behind the login box (CaseWhen greens: drifting aurora + flowing waves) ---- */
/* full-bleed: fixed to the viewport so it ignores the body's side padding and reaches every edge */
.gfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.gfx .glow{position:absolute;border-radius:50%;filter:blur(64px);will-change:transform}
.gfx .g1{width:54vmax;height:54vmax;left:-12vmax;top:-16vmax;background:radial-gradient(circle,var(--accent) 0%,transparent 66%);opacity:.5;animation:gdrift1 34s ease-in-out infinite}
.gfx .g2{width:48vmax;height:48vmax;right:-14vmax;top:4vmax;background:radial-gradient(circle,var(--accent-mid) 0%,transparent 64%);opacity:.42;animation:gdrift2 44s ease-in-out infinite}
.gfx .g3{width:42vmax;height:42vmax;left:16vmax;bottom:-18vmax;background:radial-gradient(circle,var(--accent-deep) 0%,transparent 70%);opacity:.55;animation:gdrift3 38s ease-in-out infinite}
.gfx .waves{position:absolute;left:0;bottom:-1px;width:200%;height:46vh;will-change:transform}
.gfx .waves path{fill:var(--accent)}
.gfx .w1{opacity:.16;animation:gwave 24s linear infinite}
.gfx .w2{opacity:.11;height:36vh;animation:gwave 34s linear infinite reverse}
.gfx .w2 path{fill:var(--accent-mid)}
@keyframes gdrift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
@keyframes gdrift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,5vmax)}}
@keyframes gdrift3{0%,100%{transform:translate(0,0)}50%{transform:translate(4vmax,-5vmax)}}
@keyframes gwave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.gfx .glow,.gfx .waves{animation:none!important}}
.ghead{text-align:center;margin-bottom:22px}
.logo-img{display:inline-block;height:26px;width:auto;max-width:100%;object-fit:contain}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-img{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo-img{filter:brightness(0) invert(1)}
.card-title{font-family:var(--display);font-weight:700;font-size:20px;margin:16px 0 3px;letter-spacing:-.01em}
.card p.k{color:var(--muted);font-size:13px;margin:0}
.logo-hdr{height:22px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.fld input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-size:15px;color:var(--fg);font-family:inherit}
.fld input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gbtn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;margin-top:6px}
:root[data-theme="dark"] .gbtn{color:#0b2520}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gbtn{color:#0b2520}}
.gerr{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gerr{color:#ff8a7a}}
/* ---- app ---- */
.wrap{max-width:880px;margin:0 auto;padding-block:0 64px}
header.brand{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:18px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1.t{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.5vw,30px);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.note{background:var(--prop-bg);border:1px solid var(--prop);color:var(--prop);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:10px;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--accent-mid)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b2520}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0b2520}}
.chip.prop[aria-pressed="true"]{background:var(--prop);border-color:var(--prop);color:#fff}
.spacer{flex:1 1 auto;min-width:8px}
select.month{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
.daygrp{margin-top:24px}
.dayhd{display:flex;align-items:center;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);background:var(--bg);padding-block:8px;z-index:8}
.dayhd .dnum{font-family:var(--display);font-weight:700;font-size:16px}
.dayhd .dwk{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dayhd .dline{flex:1;height:1px;background:var(--line)}
.dayhd .dcount{font-size:12px;color:var(--muted)}
.posts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.post{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;cursor:pointer;font-family:inherit;color:inherit;box-shadow:var(--shadow);transition:.12s}
.post:hover{border-color:var(--accent-mid);transform:translateY(-1px)}
.post:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.post.prop{border-style:dashed;border-color:var(--prop);background:transparent;box-shadow:none}
.post.prop:hover{border-color:var(--prop)}
.pf{display:flex;align-items:center;gap:9px;min-width:0}
.plat{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.plat.thumb{width:38px;height:38px;flex:0 0 38px;background-size:cover;background-position:center;border:2px solid #fff;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.plat.thumb .mct{position:absolute;right:-5px;bottom:-5px;background:var(--accent-deep);color:#fff;font-size:9.5px;font-weight:700;line-height:1;padding:3px 4px;border-radius:6px;border:1.5px solid var(--surface)}
:root[data-theme="dark"] .plat.thumb .mct{background:var(--accent-mid);color:#0b2520}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .plat.thumb .mct{background:var(--accent-mid);color:#0b2520}}
.pmeta{min-width:0}
/* modal media gallery */
.mmedia{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 0 8px;margin:-2px 0 4px}
.mmedia img{height:min(46vh,340px);width:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);scroll-snap-align:center;flex:0 0 auto}
.mmcount{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.mreel{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:13px;margin-bottom:14px}
.mreel .mreel-ic{display:grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
:root[data-theme="dark"] .mreel .mreel-ic{color:#0b2520}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mreel .mreel-ic{color:#0b2520}}
.plat.thumb .mct.play{background:rgba(0,0,0,.62);color:#fff;font-size:8px;padding:0;width:16px;height:16px;display:grid;place-items:center;padding-left:1px;border-radius:50%}
.mreelwrap{position:relative;display:inline-block;max-width:100%;margin-bottom:4px}
.mreelposter{height:min(52vh,420px);width:auto;max-width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:block}
.mreelvid{height:min(56vh,460px);width:auto;max-width:100%;border-radius:14px;border:1px solid var(--line);background:#000;display:block}
.mreelwrap .rtag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.phandle{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname{font-size:11px;color:var(--muted);white-space:nowrap}
.pcap{min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:6px;align-items:center;justify-self:end}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.b-type{background:var(--accent-pale);color:var(--accent-deep)}
:root[data-theme="dark"] .b-type{color:var(--accent-mid)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-type{color:var(--accent-mid)}}
.b-prop{background:var(--prop);color:#fff}
.b-lang{border:1px solid var(--line);color:var(--muted)}
.b-lang.de{color:var(--de);border-color:var(--de)}
.ptime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.none{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(10,30,26,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.mhd{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.mhd .pmeta{flex:1;min-width:0}
.mclose{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px;flex:0 0 32px}
.mbody{padding:16px 18px 20px}
.mrow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.mk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mv{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mcap{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.55}
.mprop{background:var(--prop-bg);border:1px solid var(--prop);color:var(--prop);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:520px){
  .post{grid-template-columns:auto 1fr;grid-template-areas:"pf badges" "cap cap"}
  .pf{grid-area:pf}.badges{grid-area:badges}.pcap{grid-area:cap;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ptime{display:none}
}
</style>
</head>
<body>
<div id="gate">
  <div class="gfx" aria-hidden="true">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <svg class="waves w1" viewBox="0 0 2880 320" preserveAspectRatio="none"><path d="M0,180 C180,110 540,110 720,180 C900,250 1260,250 1440,180 C1620,110 1980,110 2160,180 C2340,250 2700,250 2880,180 L2880,320 L0,320 Z"/></svg>
    <svg class="waves w2" viewBox="0 0 2880 320" preserveAspectRatio="none"><path d="M0,210 C240,150 480,270 720,210 C960,150 1200,270 1440,210 C1680,150 1920,270 2160,210 C2400,150 2640,270 2880,210 L2880,320 L0,320 Z"/></svg>
  </div>
  <form class="card" id="gform" autocomplete="off">
    <div class="ghead">
      <img class="logo-img" src="casewhen-logo.png" alt="CaseWhen" width="289" height="30">
      <div class="card-title">Social Schedule</div>
      <p class="k">Internal preview · please sign in</p>
    </div>
    <div class="fld"><label for="gu">Username</label><input id="gu" type="text" autocomplete="username"></div>
    <div class="fld"><label for="gp">Password</label><input id="gp" type="password" autocomplete="current-password"></div>
    <button class="gbtn" type="submit" id="gbtn">View</button>
    <div class="gerr" id="gerr"></div>
  </form>
</div>

<div id="app" hidden><div class="wrap">
  <header class="brand">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <img class="logo-img logo-hdr" src="casewhen-logo.png" alt="CaseWhen" width="212" height="22">
      <h1 class="t" style="font-size:clamp(18px,3.5vw,24px)">Social Schedule</h1>
    </div>
    <p class="sub" id="sub"></p>
    <div class="note" id="propnote" hidden></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="filters" id="filters">
    <div id="platchips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <span class="spacer"></span>
    <button class="chip person" id="austinchip" aria-pressed="false">Austin</button>
    <button class="chip person" id="sajuchip" aria-pressed="false">Saju</button>
    <button class="chip prop" id="propchip" aria-pressed="false">Proposed</button>
    <select class="month" id="monthsel"></select>
  </div>
  <main id="list"></main>
  <p class="foot" id="foot"></p>
</div></div>
<div id="modalRoot"></div>

<script>
const PLAT={instagram:{c:'var(--ig)',ab:'IG',name:'Instagram'},tiktok:{c:'var(--tiktok)',ab:'TT',name:'TikTok'},youtube:{c:'var(--youtube)',ab:'YT',name:'YouTube'},facebook:{c:'var(--facebook)',ab:'FB',name:'Facebook'},threads:{c:'var(--threads)',ab:'TH',name:'Threads'},linkedin:{c:'var(--linkedin)',ab:'in',name:'LinkedIn'},google:{c:'var(--google)',ab:'G',name:'Google'}};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let DATA=[],fPlat=new Set(),fPerson='',fProp=false;
// Person membership: Saju owns his proposed LinkedIn posts + all German posts; Austin owns the English posts.
const personMatch=d=> fPerson==='' || (fPerson==='saju' ? (d.proposed||d.lang==='DE') : (d.lang==='EN'&&!d.proposed));
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Display name override: the Facebook account "CaseWhen (Austin Levine)" is shown simply as "CaseWhen Facebook".
const handleOf=d=>d.handle==='CaseWhen (Austin Levine)'?'CaseWhen Facebook':d.handle;
// Media lives at the site root (../ from /schedule/). Returns absolute image URLs for a post.
const MB='../';
const mediaUrls=d=>(d.media||[]).map(p=>/^https?:/.test(p)?p:MB+p);
const parse=d=>{const[y,m,da]=d.date.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,da));return{...d,_dt:dt,_mkey:y+'-'+String(m).padStart(2,'0'),_y:y,_m:m,_da:da,_wk:dt.getUTCDay()};};

let ENCBUF=null;
async function loadEnc(){
  if(ENCBUF)return ENCBUF;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  let resp;
  try{resp=await fetch('schedule.enc?_='+Date.now(),{signal:ctl.signal});}
  catch(e){throw new Error('NET');}
  finally{clearTimeout(to);}
  if(!resp.ok)throw new Error('NET');
  ENCBUF=await resp.arrayBuffer();
  return ENCBUF;
}
async function decrypt(pw){
  if(!(window.crypto&&crypto.subtle))throw new Error('CRYPTO');
  const buf=await loadEnc();
  const b=new Uint8Array(buf),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);}
  catch(e){throw new Error('PW');}
  return JSON.parse(new TextDecoder().decode(pt));
}
function showApp(raw){
  // Build the schedule while the login is still present, so a failure can't strand the user.
  DATA=raw.map(parse);buildStats();buildFilters();render();
  // Then swap to the schedule like a page change: reveal it, fully remove the login, land at the top.
  document.getElementById('app').hidden=false;
  const g=document.getElementById('gate');if(g)g.remove();
  document.documentElement.classList.remove('locked');  // release the login scroll-lock
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(_){}
  window.scrollTo(0,0);
  if(document.scrollingElement)document.scrollingElement.scrollTop=0;
}
document.documentElement.classList.add('locked');  // lock scroll while the login gate is shown
document.getElementById('gform').addEventListener('submit',async e=>{
  e.preventDefault();const u=document.getElementById('gu').value.trim().toLowerCase(),pw=document.getElementById('gp').value;
  const err=document.getElementById('gerr');const btn=document.getElementById('gbtn');
  err.textContent='';btn.textContent='Decrypting…';btn.disabled=true;
  if(u!=='casewhen'){err.textContent='Wrong username or password.';btn.textContent='View';btn.disabled=false;return;}
  let raw;
  try{
    raw=await decrypt(pw);
  }catch(e){
    err.textContent=e&&e.message==='NET'?'Couldn’t load the schedule — check your connection and tap View again.'
      :e&&e.message==='CRYPTO'?'This browser can’t run the decryption step. Open the link in Safari or Chrome (not an in-app browser).'
      :'Wrong username or password.';
    btn.textContent='View';btn.disabled=false;return;
  }
  try{showApp(raw);}
  catch(e){err.textContent='Couldn’t open the schedule — please reload and try again.';btn.textContent='View';btn.disabled=false;}
});
/* no session persistence: the password is required on every load — nothing is remembered. */

function buildStats(){
  const sc=DATA.filter(d=>!d.proposed),pr=DATA.filter(d=>d.proposed);
  const byP={};sc.forEach(d=>byP[d.platform]=(byP[d.platform]||0)+1);
  const first=DATA.reduce((a,b)=>a._dt<b._dt?a:b),last=DATA.reduce((a,b)=>a._dt>b._dt?a:b);
  document.getElementById('sub').innerHTML='<b>'+sc.length+'</b> scheduled posts · '+MON[first._m-1]+' '+first._y+' – '+MON[last._m-1]+' '+last._y+' · view only';
  if(pr.length){const n=document.getElementById('propnote');n.hidden=false;
    n.textContent='+ '+pr.length+' PROPOSED posts for Saju’s personal LinkedIn (dashed border) — awaiting Saju’s approval, not yet scheduled.';}
  const order=['instagram','facebook','linkedin','threads','tiktok','youtube','google'];
  document.getElementById('stats').innerHTML=order.filter(p=>byP[p]).map(p=>'<span class="stat"><span class="dot" style="background:'+PLAT[p].c+'"></span>'+PLAT[p].name+' <b>'+byP[p]+'</b></span>').join('');
}
function buildFilters(){
  const plats=[...new Set(DATA.map(d=>d.platform))].sort((a,b)=>DATA.filter(x=>x.platform===b).length-DATA.filter(x=>x.platform===a).length);
  document.getElementById('platchips').innerHTML='<button class="chip" data-p="" aria-pressed="true">All channels</button>'+plats.map(p=>'<button class="chip" data-p="'+p+'" aria-pressed="false">'+PLAT[p].name+'</button>').join('');
  document.getElementById('platchips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const p=b.dataset.p;if(p==='')fPlat.clear();else fPlat.has(p)?fPlat.delete(p):fPlat.add(p);document.querySelectorAll('#platchips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.p===''?(fPlat.size===0):fPlat.has(c.dataset.p)));render();});
  document.getElementById('propchip').addEventListener('click',e=>{fProp=!fProp;e.target.setAttribute('aria-pressed',fProp);render();});
  // Person filters: Austin = all English content, Saju = all German content. Mutually exclusive; re-click clears.
  const setPerson=p=>{fPerson=p;
    document.getElementById('austinchip').setAttribute('aria-pressed',fPerson==='austin');
    document.getElementById('sajuchip').setAttribute('aria-pressed',fPerson==='saju');
    render();};
  document.getElementById('austinchip').addEventListener('click',()=>setPerson(fPerson==='austin'?'':'austin'));
  document.getElementById('sajuchip').addEventListener('click',()=>setPerson(fPerson==='saju'?'':'saju'));
  const months=[...new Set(DATA.map(d=>d._mkey))].sort();
  document.getElementById('monthsel').innerHTML='<option value="">Jump to month…</option>'+months.map(mk=>{const[y,m]=mk.split('-');return '<option value="'+mk+'">'+MON[+m-1]+' '+y+'</option>';}).join('');
  document.getElementById('monthsel').addEventListener('change',e=>{const el=document.getElementById('d-'+e.target.value);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
}
function render(){
  let rows=DATA.filter(d=>(fPlat.size===0||fPlat.has(d.platform))&&personMatch(d)&&(!fProp||d.proposed));
  const list=document.getElementById('list');
  if(!rows.length){list.innerHTML='<p class="none">No posts for this selection.</p>';document.getElementById('foot').textContent='';return;}
  const groups={};rows.forEach(d=>{(groups[d.date]=groups[d.date]||[]).push(d);});
  const dates=Object.keys(groups).sort();let html='';
  dates.forEach(date=>{
    const g=groups[date].sort((a,b)=>((a.proposed?1:0)-(b.proposed?1:0))||(a.utc+a.platform).localeCompare(b.utc+b.platform));
    const d0=g[0];
    html+='<section class="daygrp" data-mk="'+d0._mkey+'"><div class="dayhd"><span class="dnum">'+MON[d0._m-1]+' '+d0._da+'</span><span class="dwk">'+WK[d0._wk]+' '+d0._y+'</span><span class="dline"></span><span class="dcount">'+g.length+'</span></div><div class="posts">';
    g.forEach(d=>{
      const P=PLAT[d.platform]||{c:'#888',ab:'?',name:d.platform};
      const mu=mediaUrls(d);
      const isReel=d.type==='Reel';
      const corner=isReel?'<span class="mct play">►</span>':(mu.length>1?'<span class="mct">'+mu.length+'</span>':'');
      const plat=mu.length
        ? '<span class="plat thumb'+(mu.length>1?' multi':'')+'" style="background-image:url('+esc(mu[0])+');border-color:'+(d.proposed?'var(--prop)':P.c)+'">'+corner+'</span>'
        : '<span class="plat" style="background:'+(d.proposed?'var(--prop)':P.c)+'">'+P.ab+'</span>';
      html+='<button class="post'+(d.proposed?' prop':'')+'" data-i="'+DATA.indexOf(d)+'">'+
        '<span class="pf">'+plat+'<span class="pmeta"><div class="phandle">'+esc(handleOf(d))+'</div><div class="pname">'+P.name+'</div></span></span>'+
        '<span class="pcap">'+esc((d.caption||'').split('\n')[0])+'</span>'+
        '<span class="badges">'+(d.proposed?'<span class="badge b-prop">PROPOSED</span>':'')+'<span class="badge b-type">'+d.type+'</span><span class="badge b-lang '+(d.lang==='DE'?'de':'')+'">'+d.lang+'</span><span class="ptime">'+d.ber+'</span></span></button>';
    });
    html+='</div></section>';
  });
  list.innerHTML=html;
  const seen=new Set();list.querySelectorAll('.daygrp').forEach(s=>{const mk=s.dataset.mk;if(!seen.has(mk)){seen.add(mk);s.id='d-'+mk;}});
  list.querySelectorAll('.post').forEach(b=>b.addEventListener('click',()=>openModal(DATA[+b.dataset.i])));
  document.getElementById('foot').innerHTML=rows.length+' of '+DATA.length+' entries · times in Berlin time · view-only for the CaseWhen team';
}
function openModal(d){
  const P=PLAT[d.platform]||{c:'#888',ab:'?',name:d.platform};
  const mu=mediaUrls(d);
  let mediaBlock='';
  if(d.type==='Reel'&&d.video){
    mediaBlock='<div class="mreelwrap"><video class="mreelvid" controls playsinline preload="metadata" poster="'+esc(mu[0]||'')+'"><source src="'+esc(d.video)+'" type="video/mp4"></video></div><div class="mmcount">Preview clip · the full-quality reel publishes to the platform.</div>';
  }else if(d.type==='Reel'&&mu.length){
    mediaBlock='<div class="mreelwrap"><img class="mreelposter" loading="lazy" decoding="async" src="'+esc(mu[0])+'" alt="Reel preview"><span class="rtag">► Reel</span></div><div class="mmcount">Opening frame — the full reel plays on the platform.</div>';
  }else if(mu.length){
    mediaBlock='<div class="mmedia">'+mu.map((u,i)=>'<img loading="lazy" decoding="async" src="'+esc(u)+'" alt="'+(d.type==='Carousel'?'Slide '+(i+1):'Media')+'">').join('')+'</div>'+(mu.length>1?'<div class="mmcount">'+mu.length+' '+(d.type==='Carousel'?'slides':'images')+' · swipe to see all →</div>':'');
  }else if(d.type==='Reel'){
    mediaBlock='<div class="mreel"><span class="mreel-ic">►</span> Reel · vertical video — it plays on the platform (not hosted in this preview)</div>';
  }
  document.getElementById('modalRoot').innerHTML='<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true"><div class="mhd"><span class="plat" style="width:38px;height:38px;flex:0 0 38px;border-radius:11px;font-size:15px;background:'+(d.proposed?'var(--prop)':P.c)+'">'+P.ab+'</span><span class="pmeta"><div class="phandle" style="font-size:15px">'+esc(handleOf(d))+'</div><div class="pname">'+P.name+'</div></span><button class="mclose" id="mclose" aria-label="Close">✕</button></div><div class="mbody">'+mediaBlock+(d.proposed?'<div class="mprop">PROPOSED for Saju’s personal LinkedIn — not yet scheduled, awaiting his approval.</div>':'')+'<div class="mrow">'+kv('Date',MON[d._m-1]+' '+d._da+', '+d._y+' ('+WK[d._wk]+')')+kv('Berlin',d.ber)+kv('US East',d.et)+kv('UTC',d.utc)+kv('Type',d.type)+kv('Language',d.lang==='DE'?'German':'English')+'</div><div class="mk" style="margin-bottom:7px">Caption</div><div class="mcap">'+esc(d.caption||'(no text)')+'</div></div></div></div>';
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')close();});
  document.getElementById('mclose').addEventListener('click',close);
  document.addEventListener('keydown',function h(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',h);}});
}
const kv=(k,v)=>'<div><div class="mk">'+k+'</div><div class="mv">'+esc(v||'–')+'</div></div>';
</script>
</body>
</html>
